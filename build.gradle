plugins {
    id 'idea'
}

// Conventions every loader module shares. The loader plugins themselves (ModDevGradle, Loom) are
// applied per module, since they are what actually differs.
subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    version = mod_version
    group = mod_group_id

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
        withSourcesJar()
    }

    repositories {
        mavenLocal()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
        options.compilerArgs << '-Xlint:all' << '-Xlint:-processing'
    }

    tasks.withType(Jar).configureEach {
        manifest {
            attributes([
                    'Specification-Title'     : mod_name,
                    'Specification-Vendor'    : mod_authors,
                    'Specification-Version'   : '1',
                    'Implementation-Title'    : mod_name,
                    'Implementation-Version'  : mod_version,
                    'Implementation-Vendor'   : mod_authors
            ])
        }
    }

    publishing {
        publications {
            register('mavenJava', MavenPublication) {
                from components.java
            }
        }
        repositories {
            maven {
                url = "file://${rootProject.projectDir}/repo"
            }
        }
    }

    // Forward the console so you can type commands into runServer.
    tasks.withType(JavaExec).configureEach {
        if (name.startsWith('run')) {
            standardInput = System.in
        }
    }
}

idea.module {
    excludeDirs += file('repo')
}

/**
 * Gathers both loader jars into build/libs at the root, so a release has one place to grab from.
 * ./gradlew collectJars
 */
tasks.register('collectJars', Copy) {
    group = 'build'
    description = 'Copies the NeoForge and Fabric jars into the root build/libs directory.'
    subprojects.each { dependsOn "${it.path}:build" }
    from({ subprojects.collect { it.layout.buildDirectory.dir('libs') } }) {
        include '*.jar'
        exclude '*-sources.jar'
    }
    into layout.buildDirectory.dir('libs')
}
