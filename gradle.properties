org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Mod
mod_id=hungerstrike
mod_name=Hunger Strike
mod_version=9.0.0
mod_group_id=com.jaquadro.minecraft.hungerstrike
mod_authors=Texelsaur
mod_license=MIT
mod_description=Restores pre-hunger health mechanics.

# Minecraft
# 26.x ships unobfuscated, so both loaders compile against official Mojang names and common/ needs
# no mapping shim.
minecraft_version=26.2

# NeoForge
moddev_version=2.0.141
neo_version=26.2.0.81
# Lower bound of the NeoForge versions this build is compatible with.
neo_version_range=[26.2.0.59,)
minecraft_version_range=[26.2,26.3)
loader_version_range=[3,)

# Fabric
loom_version=1.17.13
fabric_loader_version=0.19.3
fabric_api_version=0.157.0+26.2
fabric_minecraft_version_range=~26.2
