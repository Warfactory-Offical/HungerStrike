name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build both loaders
        run: ./gradlew collectJars --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hungerstrike-jars
          # collectJars gathers the NeoForge and Fabric jars here; sources jars stay in the
          # subprojects' own build/libs.
          path: build/libs/*.jar
          if-no-files-found: error
